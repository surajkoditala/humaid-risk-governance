[project]
name = "humaid-risk-governance-langgraph"
version = "0.1.0"
description = "LangGraph-based alternate orchestration engine for the Risk Assessment Workbench's three AI touchpoints (category mapping, document extraction, narrative drafting)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-anthropic>=0.2",
    "langchain-google-genai>=2.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]
