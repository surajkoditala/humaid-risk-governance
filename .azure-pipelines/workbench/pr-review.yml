# PR validation for the Workbench (API + webapp).
# Runs on PRs to release/1.00 that touch the paths below; the Mock API has its
# own pipeline (.azure-pipelines/mock-api). Repo is on GitHub, pipeline in Azure
# DevOps (needs the GitHub service connection).
#
# Hard gates (a failure turns the required GitHub check red and blocks the merge):
#   build, unit tests, webapp build, vulnerable dependencies, AI review blockers.
# Informational: Semgrep findings (results are published as a build artifact).
trigger: none

pr:
  branches:
    include: [release/1.00]
  paths:
    include:
      - src/1-API/*
      - src/2-Infrastructure/*
      - src/3-Service/*
      - src/4-Persistence/*
      - tests/*
      - webapp/*
      - .azure-pipelines/workbench/*
      - .azure-pipelines/templates/*   # shared review logic: re-run when it changes
      - .azure-pipelines/scripts/*

variables:
  - group: ai-review-secrets
  - name: WEB_PROJECT
    value: src/1-API/Humaid.RiskGovernance.AdminUI.Web/Humaid.RiskGovernance.AdminUI.Web.csproj
  - name: TEST_PROJECT
    value: tests/Humaid.RiskGovernance.AdminUI.UnitTests/Humaid.RiskGovernance.AdminUI.UnitTests.csproj

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    fetchDepth: 0    # the AI review diffs the PR merge commit against its base

  - task: UseDotNet@2
    displayName: 'Install .NET SDK'
    inputs:
      packageType: sdk
      version: '10.0.x'

  - task: NodeTool@0    # Vite 7 needs Node >= 22.12 (also runs the Claude CLI)
    displayName: 'Install Node.js'
    inputs:
      versionSpec: '22.x'

  - script: dotnet build "$(WEB_PROJECT)" -c Release
    displayName: 'Build API'

  - script: |
      dotnet test "$(TEST_PROJECT)" -c Release \
        --logger "trx;LogFileName=unit-tests.trx" \
        --results-directory "$(Build.ArtifactStagingDirectory)/test-results"
    displayName: 'Unit tests'

  - task: PublishTestResults@2
    displayName: 'Publish test results'
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: '**/*.trx'
      searchFolder: $(Build.ArtifactStagingDirectory)/test-results
      failTaskOnFailedTests: false    # the test step above is the gate

  - script: |
      set -e
      npm ci --no-audit --no-fund
      npm run build
    displayName: 'Build webapp'
    workingDirectory: webapp

  - script: |
      set -e
      bash .azure-pipelines/scripts/dotnet-vuln-check.sh "$(WEB_PROJECT)" "$(TEST_PROJECT)"
      npm audit --prefix webapp --audit-level=high
    displayName: 'Dependency vulnerability audit'

  - script: |
      set -e
      pip install --quiet semgrep==1.136.0
      semgrep scan --config auto --json-output "$(Build.ArtifactStagingDirectory)/semgrep-results.json" .
    displayName: 'Semgrep scan (informational)'

  - template: ../templates/ai-review.yml
    parameters:
      title: Workbench
      prompt: .azure-pipelines/workbench/prompt.md
      scope: >-
        src/1-API src/2-Infrastructure src/3-Service src/4-Persistence tests webapp
        .azure-pipelines/workbench .azure-pipelines/templates .azure-pipelines/scripts

  - publish: $(Build.ArtifactStagingDirectory)
    artifact: 'workbench-pr-review-$(Build.BuildId)'
    displayName: 'Publish results (tests, Semgrep, AI review)'
    condition: succeededOrFailed()
