variables:

  buildId: '' # Can be overridden by pipeline UI or YAML parameters
  
  # Azure Service Connection
  azureSubscription: 'azure-cloud'

  # Shared ACR
  acrName: crghdev01
  acrLoginServer: crghdev01.azurecr.io
  acrLoginServername: crghdev01

  # DEV
  devResourceGroup: rg-gh-dev
  devContainerApp: ca-gh-hrg-workbench-dev
  devUaiName: id-ca-gh-dev   # user-assigned identity granted AcrPull in iac

  # Docker image tar artifact
  artifactName: gh-hrg-workbench-image-tar

  # Note: the SPA's Auth0 settings are NOT pipeline variables. The webapp reads them at runtime
  # from the API's /config.json, which serves the container app's own AUTH0_DOMAIN /
  # AUTH0_CLIENT_ID / AUTH0_AUDIENCE env vars - see docs/architecture/auth0-setup.md.