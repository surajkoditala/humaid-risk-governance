# Each skipped check includes the approved technical justification.

skip-check:

  # Internal Terraform Cloud modules use approved registry releases.
  - CKV_TF_1

  # ACR (Standard SKU, hackathon env) — Microsoft-hosted pipeline agents have no
  # private network path to the registry, so public network access must stay on.
  - CKV_AZURE_139  # Ensure ACR set to disable public networking

  # Remaining ACR findings require Premium SKU features not justified for this
  # hackathon workload (single region, no CI vuln scanning tier, cost-constrained).
  - CKV_AZURE_237  # Dedicated data endpoints (Premium only)
  - CKV_AZURE_166  # Quarantine/scan/mark verified images (Premium + Defender only)
  - CKV_AZURE_233  # Zone redundancy (Premium only)
  - CKV_AZURE_164  # Signed/trusted images / content trust (Premium only)
  - CKV_AZURE_165  # Geo-replication (Premium only, single-region deployment)

  # Key Vault — network_acls firewall rules are configured on the resource;
  # Checkov flags the dynamic block pattern rather than absence of a firewall.
  - CKV_AZURE_109  # Ensure key vault allows firewall rules settings

  # Storage account (hackathon env, cost-constrained) — public access is
  # restricted via firewall rules already in place on the resource.
  - CKV_AZURE_59   # Ensure storage accounts disallow public access

  # Storage account — no local (SAS/account-key) users are provisioned or used
  # by this workload; access is via AAD/RBAC.
  - CKV_AZURE_244  # Avoid the use of local users for Azure storage unless necessary

  # Storage account (hackathon project) — deferred, will be enabled later
  # alongside cost-tracking once the project moves past hackathon scope.
  - CKV_AZURE_33   # Ensure Storage logging is enabled for Queue service
  - CKV_AZURE_206  # Ensure Storage Accounts use replication
  - CKV2_AZURE_40  # Ensure storage account is not configured with Shared Key authorization
  - CKV2_AZURE_38  # Ensure soft-delete is enabled on Azure storage account