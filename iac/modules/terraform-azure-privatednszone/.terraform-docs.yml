---
formatter: markdown table

settings:
  required: false

output:
  file: README.md
  mode: inject
  sort-by: name
  header-from: README.md
  output-values: true
  output-variables: true
  output-providers: true
  output-requirements: true
  output-resources: true
 
content: |-
  {{ .Header }}

  {{ include "Intro.md" }}

  #Examples

  #Default Example
  ```hcl
  {{ include "examples/default/main.tf" }}

  {{ include "examples/default/variables.tf" }}

  {{ include "examples/default/outputs.tf" }}

  {{ include "examples/default/terraform.tf" }}

  {{ include "examples/default/providers.tf" }}

  {{ include "examples/default/locals.tf" }}
  ```

  {{ .Requirements }}

  {{ .Providers }}

  {{ .Modules }}

  {{ .Resources }}

  {{ .Inputs }}

  {{ .Outputs }}

  {{ include "CHANGELOG.md" }}

  {{ .Footer }}